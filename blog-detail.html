<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membaca Artikel - Skillance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .article-content { font-size: 1.1rem; line-height: 1.8; color: #444; }
        .article-content p { margin-bottom: 20px; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-navy shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <i class="fa-solid fa-code text-gold fs-4"></i>
                <div class="d-flex flex-column">
                    <span class="fw-bold lh-1 text-white">SKILLANCE</span>
                    <span class="small text-white-50" style="font-size: 0.65rem;">KEMBALI KE BERANDA</span>
                </div>
            </a>
        </div>
    </nav>

    <div class="container py-5" id="blog-container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                
                <div id="loading" class="text-center py-5">
                    <i class="fa-solid fa-spinner fa-spin fa-3x text-navy mb-3"></i>
                    <p class="text-muted">Sedang mengambil artikel...</p>
                </div>

                <div id="article-body" style="display: none;">
                    <a href="index.html#blog" class="text-decoration-none text-muted small fw-bold mb-4 d-inline-block hover-navy">
                        <i class="fa-solid fa-arrow-left me-1"></i> Kembali ke List Artikel
                    </a>

                    <div class="mb-4">
                        <span class="badge bg-gold-subtle text-gold mb-3 px-3 py-2 rounded-pill" id="b-category">Kategori</span>
                        <h1 class="fw-bold font-heading text-navy" id="b-title">Judul Artikel Akan Muncul di Sini</h1>
                        <div class="text-muted small mt-3 d-flex align-items-center gap-3">
                            <span><i class="fa-solid fa-user me-1"></i> Ditulis oleh <strong id="b-author">Admin</strong></span>
                            <span><i class="fa-regular fa-calendar me-1"></i> <span id="b-date">Tanggal</span></span>
                        </div>
                    </div>

                    <img id="b-image" src="" class="img-fluid rounded-4 shadow-sm mb-5 w-100" style="max-height: 450px; object-fit: cover;" alt="Cover">

                    <div class="article-content bg-white p-4 p-lg-5 rounded-4 shadow-sm" id="b-content">
                        </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 1. Ambil ID dari URL (contoh: ?id=1)
            const urlParams = new URLSearchParams(window.location.search);
            const blogId = urlParams.get('id');

            if(!blogId) {
                document.getElementById('loading').innerHTML = '<h5 class="text-danger">Artikel tidak ditemukan. (ID Kosong)</h5>';
                return;
            }

            // 2. Panggil API dengan ID tersebut
            fetch(`api/get_blog_detail.php?id=${blogId}`)
                .then(response => response.json())
                .then(res => {
                    if(res.status === 'success') {
                        // Sembunyikan Loading, Tampilkan Body
                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('article-body').style.display = 'block';

                        // Isi data ke HTML
                        const badgeEl = document.getElementById('b-category');
                        badgeEl.innerText = res.data.category;
                        badgeEl.className = `badge ${res.data.badge_class} mb-3 px-3 py-2 rounded-pill`;
                        
                        document.getElementById('b-title').innerText = res.data.title;
                        document.getElementById('b-author').innerText = res.data.author;
                        document.getElementById('b-date').innerText = res.data.date;
                        document.getElementById('b-image').src = res.data.image;
                        document.getElementById('b-content').innerHTML = res.data.content;
                        
                        // Ubah TItle Tab Browser
                        document.title = res.data.title + " - Skillance";
                    } else {
                        document.getElementById('loading').innerHTML = `<h5 class="text-danger">${res.message}</h5>`;
                    }
                })
                .catch(err => {
                    document.getElementById('loading').innerHTML = '<h5 class="text-danger">Gagal menghubungi server.</h5>';
                });
        });
    </script>
</body>
</html>
